<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SecureApp</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.08); width: 100%; max-width: 380px; animation: _liF 0.4s ease both; }
  .login-box h1 { font-size: 1.5rem; text-align: center; margin-bottom: 0.25rem; }
  .login-box .sub { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
  .login-box .err { color: #c4392c; font-size: 0.82rem; background: rgba(196,57,44,.06); padding: 0.5rem 0.75rem; border-radius: 6px; margin-bottom: 0.75rem; display: none; }
  .login-box label { display: block; font-size: 0.75rem; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
  .login-box input { width: 100%; padding: 0.7rem 0.85rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; margin-bottom: 1rem; outline: none; transition: border 0.2s; }
  .login-box input:focus { border-color: #555; }
  .login-box .btn-login { width: 100%; padding: 0.75rem; background: #333; color: #fff; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .login-box .btn-login:hover { background: #555; }
  .login-box .btn-login:disabled { background: #aaa; cursor: default; }
  .login-box .admin-link { text-align: center; margin-top: 0.75rem; }
  .login-box .admin-link a { color: #888; font-size: 0.8rem; text-decoration: none; }
  .login-box .admin-link a:hover { color: #333; }
  @keyframes _liF { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="login-box">
  <h1>Sign In</h1>
  <p class="sub">Enter your credentials</p>
  <div id="login-error" class="err"></div>
  <label for="login-username">Username</label>
  <input type="text" id="login-username" autocomplete="username" autofocus>
  <label for="login-password">Password</label>
  <input type="password" id="login-password" autocomplete="current-password">
  <button id="login-btn" class="btn-login" onclick="App.login(false)">Sign In</button>
  <p class="admin-link"><a href="#" onclick="App.login(true);return false;">Admin Login</a></p>
</div>
<script src="/js/app.js"></script>
<script>
  document.getElementById('login-password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') App.login(false);
  });
</script>
</body>
</html>
